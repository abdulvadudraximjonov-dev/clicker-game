<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Custom Image Clicker</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background: radial-gradient(circle, #2c3e50 0%, #000000 100%);
            color: white;
            font-family: 'Arial', sans-serif;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 15px 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
        }

        .level-title {
            font-size: 20px;
            font-weight: bold;
            color: #3498db;
            margin-bottom: 5px;
        }

        .score-value {
            font-size: 44px;
            font-weight: bold;
            color: #f1c40f;
            text-shadow: 0 0 15px rgba(241, 196, 15, 0.5);
        }

        /* Tanga / Rasm tugmasi */
        .coin-btn {
            width: 210px;
            height: 210px;
            border-radius: 50%;
            background: radial-gradient(circle, #f39c12 0%, #d35400 100%);
            border: 8px solid #f1c40f;
            box-shadow: 0 0 30px rgba(241, 196, 15, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 80px;
            cursor: pointer;
            transition: transform 0.1s ease;
            position: relative;
            overflow: hidden;
        }

        .coin-btn img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            display: none;
        }

        .coin-btn:active {
            transform: scale(0.92);
        }

        /* Galereyadan rasm yuklash tugmasi */
        .upload-btn {
            background: linear-gradient(45deg, #e74c3c, #8e44ad);
            color: white;
            padding: 12px 24px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: none; /* 50,000 balldan keyin ko'rinadi */
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            border: 2px solid #fff;
            margin-top: 10px;
        }

        /* Energiya paneli */
        .energy-container {
            width: 80%;
        }

        .energy-text {
            font-size: 16px;
            margin-bottom: 6px;
        }

        .energy-bar {
            width: 100%;
            height: 12px;
            background-color: #333333;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #555555;
        }

        .energy-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #f1c40f, #e67e22);
            transition: width 0.2s ease;
        }

        /* Uchuvchi sonlar */
        .float-text {
            position: absolute;
            font-size: 32px;
            font-weight: bold;
            color: #ffffff;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            text-shadow: 0 0 5px rgba(0,0,0,0.8);
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-80px); }
        }
    </style>
</head>
<body>

    <div>
        <div class="level-title" id="level-name">Bronze Hamster 🥉</div>
        <div class="score-value" id="score">0</div>
    </div>

    <div class="coin-btn" id="coin">
        <span id="coin-emoji">🐹</span>
        <img id="coin-img" src="" alt="Custom Image">
    </div>

    <input type="file" id="image-input" accept="image/*" style="display: none;">
    <label for="image-input" class="upload-btn" id="upload-label">🖼️ Galereyadan rasm qo'yish</label>

    <div class="energy-container">
        <div class="energy-text">⚡ <span id="energy">1000</span> / 1000</div>
        <div class="energy-bar">
            <div class="energy-fill" id="energy-fill"></div>
        </div>
    </div>

    <script>
        let score = parseInt(localStorage.getItem('h_score')) || 0;
        let energy = parseInt(localStorage.getItem('h_energy')) || 1000;
        let customImage = localStorage.getItem('h_custom_img') || null;
        const maxEnergy = 1000;

        const scoreEl = document.getElementById('score');
        const energyEl = document.getElementById('energy');
        const energyFillEl = document.getElementById('energy-fill');
        const coinEl = document.getElementById('coin');
        const coinEmoji = document.getElementById('coin-emoji');
        const coinImg = document.getElementById('coin-img');
        const levelNameEl = document.getElementById('level-name');
        const uploadLabel = document.getElementById('upload-label');
        const imageInput = document.getElementById('image-input');

        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.expand();
        }

        function updateUI() {
            scoreEl.innerText = score.toLocaleString();
            energyEl.innerText = energy;
            energyFillEl.style.width = (energy / maxEnergy * 100) + '%';

            // 50,000 BALGA YETGANDA:
            if (score >= 50000) {
                uploadLabel.style.display = 'inline-block'; // Rasm yuklash tugmasi chiqadi
                levelNameEl.innerText = "LEGENDARY HAMSTER 👑";
                levelNameEl.style.color = "#f1c40f";

                if (customImage) {
                    coinEmoji.style.display = 'none';
                    coinImg.src = customImage;
                    coinImg.style.display = 'block';
                }
            } else {
                uploadLabel.style.display = 'none';
                coinEmoji.style.display = 'block';
                coinImg.style.display = 'none';
                levelNameEl.innerText = "Bronze Hamster 🥉";
            }

            localStorage.setItem('h_score', score);
            localStorage.setItem('h_energy', energy);
        }

        // Galereyadan rasm tanlanganida bajariladigan ish
        imageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    customImage = event.target.result;
                    localStorage.setItem('h_custom_img', customImage);
                    coinEmoji.style.display = 'none';
                    coinImg.src = customImage;
                    coinImg.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        });

        coinEl.addEventListener('touchstart', function(e) {
            e.preventDefault();
            for (let i = 0; i < e.touches.length; i++) {
                handleTap(e.touches[i].clientX, e.touches[i].clientY);
            }
        });

        coinEl.addEventListener('click', function(e) {
            if (e.pointerType === 'mouse') {
                handleTap(e.clientX, e.clientY);
            }
        });

        function handleTap(x, y) {
            if (energy > 0) {
                score += 1;
                energy -= 1;

                if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
                    window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
                }

                createFloatingText(x, y, '+1');
                updateUI();
            }
        }

        function createFloatingText(x, y, text) {
            const el = document.createElement('div');
            el.className = 'float-text';
            el.innerText = text;
            el.style.left = (x - 15) + 'px';
            el.style.top = (y - 30) + 'px';
            document.body.appendChild(el);

            setTimeout(() => { el.remove(); }, 800);
        }

        setInterval(() => {
            if (energy < maxEnergy) {
                energy = Math.min(maxEnergy, energy + 3);
                updateUI();
            }
        }, 1000);

        updateUI();
    </script>
</body>
</html>
