<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Clicker Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .tab-content { display: none; flex: 1; flex-direction: column; align-items: center; justify-content: space-between; padding: 20px; overflow-y: auto; }
        .tab-content.active { display: flex; }
        
        .header { text-align: center; margin-top: 10px; }
        .score-board { font-size: 38px; font-weight: bold; color: #38bdf8; margin: 10px 0; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .score-board img { width: 45px; height: 45px; object-fit: cover; border-radius: 50%; }
        
        .level-card { background: #1e293b; width: 100%; padding: 12px 15px; border-radius: 12px; display: flex; align-items: center; justify-content: space-between; border: 1px solid #334155; }
        .progress-bar { width: 100%; background: #334155; height: 8px; border-radius: 4px; margin-top: 8px; overflow: hidden; }
        .progress-fill { background: #38bdf8; height: 100%; width: 0%; transition: width 0.3s; }

        .coin-container { position: relative; display: flex; align-items: center; justify-content: center; margin: 20px 0; }
        .coin { width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle, #38bdf8 0%, #0369a1 100%); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 30px rgba(56, 189, 248, 0.4); cursor: pointer; transition: transform 0.1s; border: 4px solid #7dd3fc; }
        .coin:active { transform: scale(0.92); }
        .coin img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: none; }
        
        .energy-container { width: 100%; max-width: 300px; }
        .energy-info { display: flex; justify-content: space-between; font-size: 14px; color: #94a3b8; margin-bottom: 5px; }
        .energy-bar { width: 100%; background: #1e293b; height: 12px; border-radius: 6px; overflow: hidden; border: 1px solid #334155; }
        .energy-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #f59e0b, #ef4444); transition: width 0.2s; }

        .shop-grid { display: grid; grid-template-columns: 1fr; gap: 12px; width: 100%; max-width: 350px; }
        .shop-btn { background: #1e293b; border: 1px solid #334155; color: #fff; padding: 12px 15px; border-radius: 12px; text-align: left; cursor: pointer; transition: 0.2s; }
        .shop-btn:active { transform: scale(0.97); background: #334155; }
        
        .list-container { width: 100%; max-width: 350px; display: flex; flex-direction: column; gap: 10px; }
        .list-item { background: #1e293b; padding: 12px 15px; border-radius: 12px; display: flex; align-items: center; justify-content: space-between; border: 1px solid #334155; }
        .list-btn { background: #0284c7; color: #fff; border: none; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: bold; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
        
        .nav { display: flex; background: #1e293b; border-top: 1px solid #334155; height: 60px; }
        .nav-btn { flex: 1; background: none; border: none; color: #94a3b8; font-size: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; gap: 4px; }
        .nav-btn.active { color: #38bdf8; font-weight: bold; }

        .float-text { position: absolute; font-size: 24px; font-weight: bold; pointer-events: none; animation: floatUp 0.8s forwards; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-80px); } }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; z-index: 100; }
        .modal-content { background: #1e293b; padding: 20px; border-radius: 15px; width: 85%; max-width: 320px; text-align: center; border: 1px solid #334155; }
        .modal-btn { background: #0284c7; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; margin-top: 15px; cursor: pointer; font-weight: bold; width: 100%; }

        .bomb { position: absolute; width: 60px; height: 60px; background: #ef4444; border-radius: 50%; display: none; align-items: center; justify-content: center; font-size: 28px; cursor: pointer; z-index: 50; box-shadow: 0 0 15px #ef4444; }
    </style>
</head>
<body>

    <div id="tab-game" class="tab-content active">
        <div class="header">
            <div class="level-card" onclick="openAdminModal()">
                <div>
                    <span id="level-name" style="font-weight: bold; color: #38bdf8;">Bronza 🥉</span>
                    <div style="font-size: 12px; color: #94a3b8;" id="level-req">0 / 2500</div>
                </div>
                <div style="font-size: 14px; background: #0369a1; padding: 4px 10px; border-radius: 8px;">Level <span id="level-num">1</span></div>
            </div>
            <div class="progress-bar"><div class="progress-fill" id="level-fill"></div></div>
        </div>

        <div class="score-board">
            <span id="coin-emoji">🪙</span>
            <img id="coin-img" src="" alt="Rasm">
            <span id="score">0</span>
        </div>

        <div class="coin-container">
            <div class="bomb" id="bomb-coin">💣</div>
            <div class="coin" id="coin">
                <span style="font-size: 70px;">🪙</span>
            </div>
        </div>

        <div class="energy-container">
            <div class="energy-info">
                <span>⚡ Energiya</span>
                <span><span id="energy">1000</span> / <span id="max-energy">1000</span></span>
            </div>
            <div class="energy-bar"><div class="energy-fill" id="energy-fill"></div></div>
        </div>
    </div>

    <div id="tab-shop" class="tab-content">
        <h2 style="margin-top: 10px; color: #38bdf8;">Boostlar</h2>
        <div class="shop-grid">
            <button class="shop-btn" onclick="buyMultitap()">
                <b>Multitap (+1 Har bosishda)</b><br><small id="boost-price">🪙 500</small>
            </button>
            <button class="shop-btn" onclick="buyAutoClicker()">
                <b>Avtokliker (+1 Sekundiga)</b><br><small id="auto-price">🪙 1000</small>
            </button>
            <button class="shop-btn" onclick="buyEnergyLimit()">
                <b>Energiya limiti (+500)</b><br><small id="elimit-price">🪙 500</small>
            </button>
            <button class="shop-btn" onclick="buyRechargeSpeed()">
                <b>Tiklanish tezligi (+1/s)</b><br><small id="erecharge-price">🪙 300</small>
            </button>
            <label class="shop-btn" style="text-align: center; cursor: pointer;">
                <b>Rasm qo'yish (50k)</b><br><small>Galereyadan tanlash</small>
                <input type="file" id="image-input" accept="image/*" style="display: none;">
            </label>
        </div>
        <div></div>
    </div>

    <div id="tab-tasks" class="tab-content">
        <h2 style="margin-top: 10px; color: #38bdf8;">Vazifalar</h2>
        <div class="list-container">
            <div class="list-item">
                <div style="text-align: left;">
                    <b>📅 Kunlik bonus</b><br><small>Har 24 soatda +2,500 tanga</small>
                </div>
                <button class="list-btn" id="daily-btn" onclick="claimDailyReward()">Olish</button>
            </div>
            <div class="list-item">
                <div style="text-align: left;">
                    📢 <b>Telegram kanalga a'zo bo'lish</b><br><small>+5,000 tanga</small>
                </div>
                <div style="display: flex; gap: 6px;">
                    <a href="https://t.me/anime_team_01" target="_blank" class="list-btn" style="text-decoration: none;">O'tish</a>
                    <button class="list-btn" id="task1-btn" onclick="completeTask(1, 5000)">Tekshirish</button>
                </div>
            </div>
        </div>
        <div></div>
    </div>

    <div id="tab-friends" class="tab-content">
        <h2 style="margin-top: 10px; color: #38bdf8;">Do'stlarni taklif qilish</h2>
        <div class="list-container">
            <div class="list-item" style="flex-direction: column; align-items: flex-start; gap: 8px;">
                <b>👥 Har bir do'st uchun</b>
                <span style="font-size: 13px; color: #94a3b8;">Siz va do'stingiz +10,000 tanga olasiz!</span>
                <button class="list-btn" style="width: 100%;" onclick="copyRefLink()">Havolani nusxalash</button>
            </div>
        </div>
        <div></div>
    </div>

    <div class="modal" id="admin-modal">
        <div class="modal-content">
            <h2>ADMIN PANEL</h2>
            <button class="modal-btn" onclick="adminAddCoins()">+100,000 Tanga</button>
            <button class="modal-btn" style="background:#f59e0b;" onclick="adminMaxEnergy()">Cheksiz Energiya</button>
            <button class="modal-btn" style="background:#ef4444;" onclick="closeAdminModal()">Yopish</button>
        </div>
    </div>

    <div class="nav">
        <button class="nav-btn active" onclick="switchTab('tab-game', this)">🎮 O'yin</button>
        <button class="nav-btn" onclick="switchTab('tab-shop', this)">🛒 Do'kon</button>
        <button class="nav-btn" onclick="switchTab('tab-tasks', this)">📋 Vazifalar</button>
        <button class="nav-btn" onclick="switchTab('tab-friends', this)">👥 Do'stlar</button>
    </div>
    <script>
        let score = parseInt(localStorage.getItem('h_score')) || 0;
        let bonusPower = parseInt(localStorage.getItem('h_bpower')) || 0;
        let maxEnergy = parseInt(localStorage.getItem('h_maxenergy')) || 1000;
        let energy = parseInt(localStorage.getItem('h_energy')) || maxEnergy;
        let rechargeSpeed = parseInt(localStorage.getItem('h_recharge')) || 1;
        let boostPrice = parseInt(localStorage.getItem('h_bprice')) || 500;
        let autoPrice = parseInt(localStorage.getItem('h_aprice')) || 1000;
        let elimitPrice = parseInt(localStorage.getItem('h_elprice')) || 500;
        let erechargePrice = parseInt(localStorage.getItem('h_erprice')) || 300;
        let autoLevel = parseInt(localStorage.getItem('h_autolvl')) || 0;
        let customImage = localStorage.getItem('h_custom_img') || null;
        let lastDaily = parseInt(localStorage.getItem('h_last_daily')) || 0;
        let task1Done = localStorage.getItem('h_task1') === 'true';

        const levels = [
            { name: "Bronza 🥉", req: 0 },
            { name: "Kumush 🥈", req: 10000 },
            { name: "Oltin 🥇", req: 25000 },
            { name: "Platina 💎", req: 50000 },
            { name: "Afsonaviy 👑", req: 100000 }
        ];

        let tapPower = 1 + bonusPower;

        function updateUI() {
            document.getElementById('score').innerText = score.toLocaleString();
            document.getElementById('energy').innerText = energy;
            document.getElementById('max-energy').innerText = maxEnergy;
            document.getElementById('energy-fill').style.width = Math.min(100, (energy / maxEnergy) * 100) + '%';
            
            document.getElementById('boost-price').innerText = '🪙 ' + boostPrice.toLocaleString();
            document.getElementById('auto-price').innerText = '🪙 ' + autoPrice.toLocaleString();
            document.getElementById('elimit-price').innerText = '🪙 ' + elimitPrice.toLocaleString();
            document.getElementById('erecharge-price').innerText = '🪙 ' + erechargePrice.toLocaleString();

            let lvlIdx = 0;
            for (let i = 0; i < levels.length; i++) {
                if (score >= levels[i].req) lvlIdx = i;
            }
            document.getElementById('level-num').innerText = lvlIdx + 1;
            document.getElementById('level-name').innerText = levels[lvlIdx].name;

            let prevReq = levels[lvlIdx].req;
            let nextReq = levels[lvlIdx + 1] ? levels[lvlIdx + 1].req : prevReq + 50000;
            let progress = Math.min(100, Math.max(0, ((score - prevReq) / (nextReq - prevReq)) * 100));
            document.getElementById('level-fill').style.width = progress + '%';
            document.getElementById('level-req').innerText = score.toLocaleString() + ' / ' + nextReq.toLocaleString();

            if (score >= 50000) {
                document.getElementById('image-input').parentElement.style.display = 'block';
                if (customImage) {
                    document.getElementById('coin-emoji').style.display = 'none';
                    document.getElementById('coin-img').src = customImage;
                    document.getElementById('coin-img').style.display = 'block';
                }
            }

            const now = new Date().getTime();
            const dailyBtn = document.getElementById('daily-btn');
            if (now - lastDaily < 86400000) {
                dailyBtn.disabled = true;
                let timeLeft = 86400000 - (now - lastDaily);
                let hours = Math.floor(timeLeft / (1000 * 60 * 60));
                let minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
                dailyBtn.innerText = hours + 's ' + minutes + 'd';
            } else {
                dailyBtn.disabled = false;
                dailyBtn.innerText = "Olish";
            }

            if (task1Done) {
                document.getElementById('task1-btn').disabled = true;
                document.getElementById('task1-btn').innerText = "Bajarilgan";
            }

            localStorage.setItem('h_score', score);
            localStorage.setItem('h_energy', energy);
            localStorage.setItem('h_maxenergy', maxEnergy);
            localStorage.setItem('h_recharge', rechargeSpeed);
            localStorage.setItem('h_bpower', bonusPower);
            localStorage.setItem('h_bprice', boostPrice);
            localStorage.setItem('h_aprice', autoPrice);
            localStorage.setItem('h_elprice', elimitPrice);
            localStorage.setItem('h_erprice', erechargePrice);
            localStorage.setItem('h_autolvl', autoLevel);
        }

        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        function buyMultitap() {
            if (score >= boostPrice) {
                score -= boostPrice; bonusPower += 1; tapPower = 1 + bonusPower;
                boostPrice = Math.floor(boostPrice * 2.2); updateUI();
            } else alert("Tangalar yetarli emas!");
        }

        function buyAutoClicker() {
            if (score >= autoPrice) {
                score -= autoPrice; autoLevel += 1;
                autoPrice = Math.floor(autoPrice * 2.5); updateUI();
            } else alert("Tangalar yetarli emas!");
        }

        function buyEnergyLimit() {
            if (score >= elimitPrice) {
                score -= elimitPrice; maxEnergy += 500; energy += 500;
                elimitPrice = Math.floor(elimitPrice * 2); updateUI();
            } else alert("Tangalar yetarli emas!");
        }

        function buyRechargeSpeed() {
            if (score >= erechargePrice) {
                score -= erechargePrice; rechargeSpeed += 1;
                erechargePrice = Math.floor(erechargePrice * 2); updateUI();
            } else alert("Tangalar yetarli emas!");
        }

        function claimDailyReward() {
            const now = new Date().getTime();
            if (now - lastDaily >= 86400000) {
                score += 2500; lastDaily = now;
                localStorage.setItem('h_last_daily', lastDaily);
                alert("Tabriklaymiz! +2,500 kunlik bonus olindi!");
                updateUI();
            }
        }

        function completeTask(id, reward) {
            score += reward;
            localStorage.setItem('h_task1', 'true');
            task1Done = true;
            alert("Vazifa bajarildi! +" + reward + " tanga!");
            updateUI();
        }

        function copyRefLink() {
            navigator.clipboard.writeText("https://t.me/my_tap_clicker_game_bot?start=ref");
            alert("Taklif havolasi nusxalandi!");
        }

        document.getElementById('image-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    customImage = event.target.result;
                    localStorage.setItem('h_custom_img', customImage);
                    updateUI();
                };
                reader.readAsDataURL(file);
            }
        });

        const bombCoin = document.getElementById('bomb-coin');
        function spawnBomb() {
            if (document.getElementById('tab-game').classList.contains('active')) {
                const x = Math.floor(Math.random() * (window.innerWidth - 80));
                const y = Math.floor(Math.random() * (window.innerHeight - 250)) + 100;
                bombCoin.style.left = x + 'px'; bombCoin.style.top = y + 'px';
                bombCoin.style.display = 'flex';
                setTimeout(() => { bombCoin.style.display = 'none'; }, 3000);
            }
        }
        setInterval(spawnBomb, 25000);

        bombCoin.addEventListener('click', function() {
            let penalty = tapPower * 2;
            score = Math.max(0, score - penalty);
            createFloatingText(parseInt(bombCoin.style.left), parseInt(bombCoin.style.top), '-' + penalty, '#ff4d4d');
            bombCoin.style.display = 'none'; updateUI();
        });

        const coinEl = document.getElementById('coin');
        coinEl.addEventListener('touchstart', function(e) {
            e.preventDefault();
            for (let i = 0; i < e.touches.length; i++) {
                handleTap(e.touches[i].clientX, e.touches[i].clientY);
            }
        });

        coinEl.addEventListener('click', function(e) {
            if (e.pointerType === 'mouse') handleTap(e.clientX, e.clientY);
        });

        function handleTap(x, y) {
            if (energy >= tapPower) {
                score += tapPower; energy -= tapPower;
                if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
                    window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
                }
                createFloatingText(x, y, '+' + tapPower, '#ffffff');
                updateUI();
            }
        }

        function createFloatingText(x, y, text, color = '#ffffff') {
            const el = document.createElement('div');
            el.className = 'float-text'; el.innerText = text; el.style.color = color;
            el.style.left = (x - 15) + 'px'; el.style.top = (y - 30) + 'px';
            document.body.appendChild(el);
            setTimeout(() => { el.remove(); }, 800);
        }

        let clickCount = 0; let clickTimer;
        function openAdminModal() {
            clickCount++;
            clearTimeout(clickTimer);
            clickTimer = setTimeout(() => { clickCount = 0; }, 2000);
            if (clickCount >= 5) {
                clickCount = 0;
                document.getElementById('admin-modal').style.display = 'flex';
            }
        }
        function closeAdminModal() { document.getElementById('admin-modal').style.display = 'none'; }
        function adminAddCoins() { score += 100000; updateUI(); closeAdminModal(); }
        function adminMaxEnergy() { energy = maxEnergy; updateUI(); closeAdminModal(); }

        setInterval(() => {
            if (autoLevel > 0) score += autoLevel;
            if (energy < maxEnergy) energy = Math.min(maxEnergy, energy + rechargeSpeed);
            updateUI();
        }, 1000);

        updateUI();
    </script>
</body>
</html>
